[workspace]
members = ["common", "agent"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mdspan/libtimewarp"

[workspace.dependencies]
cfg-if = "1.0.4"
ctor = "0.6.3"
libc = "0.2.180"

[workspace.lints.rust]
ffi_unwind_calls = "warn"
let_underscore_drop = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
non_ascii_idents = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Neither crate is published, so keywords, categories and a readme would be metadata for nobody.
cargo_common_metadata = "allow"

# Contradicts rustc's `unreachable_pub`, which wants `pub(crate)` on exactly the items this wants
# left `pub`. We keep `unreachable_pub`, because it names the visibility an item really has.
redundant_pub_crate = "allow"

# Restriction lints, which are opt-in one at a time by design. These are the ones that matter for a
# library that runs inside someone else's process: no panicking, no hidden arithmetic, every unsafe
# block justified.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_underscore = "warn"
cast_possible_truncation = "warn"
dbg_macro = "warn"
empty_drop = "warn"
exit = "warn"
expect_used = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
indexing_slicing = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
multiple_unsafe_ops_per_block = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
str_to_string = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unwrap_used = "warn"
verbose_file_reads = "warn"
