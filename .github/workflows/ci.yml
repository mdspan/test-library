name: CI

# Every job runs on every trigger: each pull request, each push to main or a release tag, the
# weekly run, and the Run workflow button. Hosted runners are free for a public repository, macOS
# and the FreeBSD VMs included, so no platform waits for a label or a schedule.
#
# A branch without a pull request runs nothing: `push` is narrowed to main and tags so a branch
# that has one open does not run twice for the same commit.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Sunday, 03:00 UTC, for what changes under an unchanged commit: the runner images, and the
    # packages the FreeBSD VMs install.
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Everything the suite has, on both architectures we support.
  linux:
    name: linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      PLATFORM: linux ${{ matrix.arch }}
      # Named, so a Go case that cannot build its program fails rather than skipping.
      GO: go
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install

      # The Go cases run a real Go runtime against the synthetic vDSO, which is the target the
      # whole mechanism exists for, and cross-compile the FreeBSD runtime whose clock fallback
      # routines the library matches by their bytes.
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # The cases that set the clock want CAP_SYS_TIME, which an ordinary user holds inside a user
      # namespace of their own. Ubuntu 24.04 restricts unprivileged namespaces by default; without
      # this those cases check the refusal and leave the move unexercised. Older images have no
      # such knob, which the fallback covers.
      - name: Let an unprivileged user take a namespace of their own
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Formatting
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --locked --workspace --all-targets --all-features

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # The arm that says the vDSO is not in this build is the one no other job compiles, since
      # every other one turns every feature on.
      - name: Clippy without the vdso feature
        run: cargo clippy --locked -p agent --no-default-features --all-targets -- -D warnings

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --workspace --all-features --no-fail-fast 2>&1 \
            | tee "$RUNNER_TEMP/test.log"

      # The library finds the FreeBSD Go runtime's clock fallback routines by their bytes, which
      # the Go assembler has encoded differently from one release to another. Each release the
      # FreeBSD sweep pins, at its latest patch, is cross-compiled here for both FreeBSD
      # architectures and checked against the encodings the library carries, with no FreeBSD
      # machine needed; go1.21.0 stands for the arm64 encoding 1.21.7 changed. Every encoding has
      # to come out of some release here. The step above checks the stable release the same way.
      - name: The Go fallback encodings of every pinned Go release
        if: matrix.arch == 'x86_64'
        shell: bash
        env:
          TIMEWARP_TEST_GO_TOOLCHAINS: >-
            go1.21.0 go1.21.13 go1.22.12 go1.23.12 go1.24.13 go1.25.14 go1.26.9 go1.27.2
        run: |
          set -o pipefail
          cargo test --locked --workspace --all-features --lib go_locate 2>&1 \
            | tee -a "$RUNNER_TEMP/test.log"

      # The Python tool is pure Python over the C library, so its own cases run wherever an
      # interpreter does. The ones that read another process's environment exercise this
      # platform's way of asking for it, which is the part that differs between the three.
      - name: Python tool
        working-directory: python
        run: PYTHONPATH=. python3 -m unittest discover -s tests -t .

      - name: Name what failed
        if: failure()
        shell: bash
        run: .github/report-failure.sh "$PLATFORM" "$RUNNER_TEMP/test.log"

      - name: Keep the log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/test.log
          retention-days: 7

  # What a Mac and a FreeBSD box are needed for is linking and running. Type-checking and linting
  # their code needs neither, so both happen here on a Linux runner, which reports a platform's
  # compile error well before that platform's own job finishes.
  #
  # What it cannot catch is a link error or a wrong answer at run time, which is what the jobs on
  # real machines below are for. FreeBSD aarch64 is missing here too, since that target has no
  # prebuilt standard library to check against; the emulated VM in the FreeBSD sweep is its only
  # cover.
  cross:
    name: cross-check macos and freebsd
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PLATFORM: cross-check
      # Which spellings libSystem has is asked of the linker at build time, and a machine with no
      # SDK gets no for every one of them. So the rows behind those probes are compiled twice: once
      # as this machine answers them, and once with all of them forced on, which is the table a
      # real SDK produces. Neither pass on its own compiles every row.
      DARWIN_CFGS: >-
        --cfg darwin_inode64 --cfg darwin_select_1050 --cfg darwin_select_extsn
        --cfg darwin_pselect_extsn --cfg darwin_kevent_qos --cfg darwin_mach_approximate_time
        --cfg darwin_mach_continuous_time --cfg darwin_mach_continuous_approximate_time
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install

      - name: Add the targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-freebsd

      - name: Clippy for each platform
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-freebsd; do
            echo "::group::${target}"
            cargo clippy --locked --workspace --all-targets --all-features \
              --target "$target" -- -D warnings
            echo "::endgroup::"
          done

      # The FreeBSD build without the Go fallback interposition, which the step above never
      # compiles since it turns every feature on.
      - name: Clippy for FreeBSD without the vdso feature
        run: >-
          cargo clippy --locked -p agent --no-default-features --all-targets
          --target x86_64-unknown-freebsd -- -D warnings

      - name: Clippy for macOS with every probed row present
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            echo "::group::${target}, every probed row forced on"
            RUSTFLAGS="$DARWIN_CFGS" cargo clippy --locked --workspace --all-targets \
              --all-features --target "$target" -- -D warnings
            echo "::endgroup::"
          done

  # Both macOS architectures. Apple silicon carries the 125:3 timebase and Intel the 1:1, and the
  # Mach conversion has to be right at both; a job on one of them leaves the other's arithmetic
  # unexecuted.
  #
  # The two entries are of different releases on purpose: a pair that differs in both the
  # architecture and the release covers more of what a program meets than a pair that differs in
  # one, since what the rows here interpose is libSystem, which is a different library on each
  # release. `macos-26` is the current one and `macos-15` the one before.
  #
  # `macos-15-intel` goes away in August 2027, and x86_64 goes with it. When it does, the x86_64
  # rows and the 1:1 ratio lose their runtime coverage and the cross-build step below becomes the
  # only thing standing behind them. `macos-26-intel` is the newer x86_64 image if this one should
  # move forward before then.
  macos:
    name: macos ${{ matrix.arch }} ${{ matrix.release }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            release: "26"
            runner: macos-26
            other: x86_64-apple-darwin
          - arch: x86_64
            release: "15"
            runner: macos-15-intel
            other: aarch64-apple-darwin
    env:
      PLATFORM: macos ${{ matrix.arch }} ${{ matrix.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install

      - name: Formatting
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --locked --workspace --all-targets --all-features

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # Which spellings libSystem has is asked of the linker at build time, and the answer differs
      # between the two architectures. Building for the other one links every row this runner does
      # not carry against the SDK, which is what says those names are the ones libSystem has.
      - name: The rows the other architecture carries
        run: |
          rustup target add ${{ matrix.other }}
          cargo build --locked --target ${{ matrix.other }} -p agent

      # A replacement with no row in `__DATA,__interpose` is never called, so the table is read back
      # out of the library that was just built before anything is run against it. This is the one
      # check a compiler that is happy cannot stand in for.
      - name: The interpose table
        run: cargo test --locked -p agent --test interpose

      # The one group this platform has that neither of the others does, and the one whose
      # conversion depends on the ratio of the machine it runs on. Named on its own so a failure
      # here is a line of its own rather than a line in the whole suite's log.
      - name: The Mach clocks
        run: cargo test --locked -p agent --test mach_clocks

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --workspace --all-features --no-fail-fast 2>&1 \
            | tee "$RUNNER_TEMP/test.log"

      - name: Python tool
        working-directory: python
        run: PYTHONPATH=. python3 -m unittest discover -s tests -t .

      - name: Name what failed
        if: failure()
        shell: bash
        run: .github/report-failure.sh "$PLATFORM" "$RUNNER_TEMP/test.log"

      - name: Keep the log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/test.log
          retention-days: 7

  # Every FreeBSD release the family table distinguishes, and the architecture no other job builds.
  #
  # The releases matter because the running kernel picks between the table's two FreeBSD columns:
  # 13.x and 14.x are where nothing counts suspended time, and 15.x is where `CLOCK_MONOTONIC` and
  # `CLOCK_BOOTTIME` do. The aarch64 entry matters because the raw system call path and the shim
  # that fakes Go are both hand-written assembly per architecture, and the aarch64 arm of each is
  # compiled and run by nothing else here.
  #
  # Each row pins a different Go release so the sweep spans Go 1.21 through 1.27, whose fallback
  # routines the library matches in each encoding the Go assembler has given them; the Linux job
  # checks those encodings against every one of these releases on each pull request, and these
  # rows run them. Two further rows stress how the rewrite lands rather than which release runs
  # it: a kernel that forbids write-and-execute at once, and a target that samples itself through
  # SIGPROF.
  #
  # The aarch64 row runs 15.1 because its Rust comes from the package repository, whose FreeBSD 15
  # packages are built on 15.1 and link against libc symbols that 15.0 lacks.
  freebsd:
    name: freebsd ${{ matrix.arch }} ${{ matrix.release }}
    runs-on: ubuntu-24.04
    # The aarch64 VM is emulated rather than accelerated, so it runs several times slower than the
    # others and carries the longer bound.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      # `go` is the release at the patch the Linux job cross-compiles, and `go_sha256` the digest
      # go.dev publishes for its FreeBSD archive on the row's architecture.
      matrix:
        include:
          - release: "13.5"
            arch: x86_64
            go: go1.21.13
            go_sha256: 56137d4a487b8fdd013c57b025079a4ec20bd19dd809035cc648887188523c64
            timeout: 60
          - release: "14.2"
            arch: x86_64
            go: go1.22.12
            go_sha256: a8c77e76859db3e6f3322cbe11deea5faf779e374f45df7554d2cb484ffa492a
            timeout: 60
          - release: "14.5"
            arch: x86_64
            go: go1.23.12
            go_sha256: c9d7029ae11a6680fba97ac63defa3d0d00220728d6c41186b2517da4b3cd0ea
            timeout: 60
          - release: "15.0"
            arch: x86_64
            go: go1.24.13
            go_sha256: 96e3c439befbb365ecde3ae475f9319ef7693d5d66a05992e8f8d29c60a63761
            timeout: 60
          - release: "15.1"
            arch: x86_64
            go: go1.25.14
            go_sha256: e85e6530832772dc5769b42e42cd5aa488dd20149a6792a4c0e87762164a60da
            timeout: 60
          - release: "15.1"
            arch: aarch64
            go: go1.26.9
            go_sha256: df0323ac1b496464ff7ab32f3bd8206b189c167f3e1759005fc012df4a3051d2
            timeout: 150
          # The newest Go, and the two targets that stress how the rewrite lands.
          - release: "15.1"
            arch: x86_64
            go: go1.27.2
            go_sha256: 3baf61eec549b0c3f638d82636388e36abf94aa14814a011f011d2648ad1eded
            timeout: 60
          # A kernel that refuses a page writable and executable at once, so the rewrite takes its
          # anonymous copy-patch-remap fallback rather than an in-place mprotect.
          - release: "15.1"
            arch: x86_64
            go: go1.27.2
            go_sha256: 3baf61eec549b0c3f638d82636388e36abf94aa14814a011f011d2648ad1eded
            allow_wx: "0"
            timeout: 60
          # Every Go target samples itself through SIGPROF, so a read taken mid-read drives the
          # shim's reentrancy guard onto its in-assembly genuine path.
          - release: "15.1"
            arch: x86_64
            go: go1.27.2
            go_sha256: 3baf61eec549b0c3f638d82636388e36abf94aa14814a011f011d2648ad1eded
            profiling: "1"
            timeout: 60
    env:
      PLATFORM: freebsd ${{ matrix.arch }} ${{ matrix.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in the VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          # Nothing the VM builds is read on the host. The one file that is, a failing run's
          # test log, is read out of the VM by the last step.
          copyback: false
          prepare: |
            # The base system carries no root certificates, so cargo cannot reach crates.io
            # until this package drops a bundle at /etc/ssl/cert.pem.
            # python3 is for the Python tool's own cases; procstat, which those cases use to
            # read another process's environment here, is in the base system.
            pkg install -y ca_root_nss python3
            if [ "${{ matrix.arch }}" = aarch64 ]; then
              # aarch64 FreeBSD is a tier 3 Rust target, with no host toolchain for rustup to
              # install, so this row builds with whatever Rust the package repository carries.
              pkg install -y rust
            else
              # rustup's own build, pinned: this one links against no libc symbol that 13.5, the
              # oldest release here, lacks. Self-update is off so that it stays this one.
              fetch -o /tmp/rustup-init \
                https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-freebsd/rustup-init
              sha256 -c af29791be32fd2f926865a983edc97f452078e6d1b4a6037d12ca2f8e67ffa3d \
                /tmp/rustup-init
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --no-modify-path --default-toolchain none
              "$HOME/.cargo/bin/rustup" set auto-self-update disable
            fi
            # The POSIX message queues live behind a module. Without it `mq_open` fails and the
            # two timed message queue waits report themselves unexercised instead of running.
            kldload mqueuefs || true
            # The pinned Go builds the program whose runtime reads the clock through the fallback
            # routines the library interposes. Installed on every arch, the emulated one included,
            # since the aarch64 shim is built and run by nothing else. `uname -m` names the
            # architecture the way Go's archives do: amd64 or arm64.
            fetch -o /tmp/go.tar.gz "https://go.dev/dl/${{ matrix.go }}.freebsd-$(uname -m).tar.gz"
            sha256 -c ${{ matrix.go_sha256 }} /tmp/go.tar.gz
            tar -C /usr/local -xzf /tmp/go.tar.gz
            # Go links a cgo program on arm64 FreeBSD with ld.bfd, which binutils carries.
            if [ "$(uname -m)" = arm64 ]; then
              pkg install -y binutils
            fi
          run: |
            if [ "${{ matrix.arch }}" = x86_64 ]; then
              . "$HOME/.cargo/env"
              rustup toolchain install
            fi
            # The pinned Go, named for the harness the way CC names the C compiler.
            export GO=/usr/local/go/bin/go
            # A hardened kernel refuses a page writable and executable at once, which sends the
            # rewrite down its anonymous-page fallback.
            if [ -n "${{ matrix.allow_wx }}" ]; then
              sysctl kern.elf64.allow_wx=${{ matrix.allow_wx }}
            fi
            # A profiling row profiles every Go target.
            if [ -n "${{ matrix.profiling }}" ]; then
              export TIMEWARP_TEST_GO_PROFILE=${{ matrix.profiling }}
            fi
            cargo build --locked --workspace --all-targets --all-features
            # Clippy's lints change from one Rust release to the next, so only the pinned
            # toolchain is held to them; aarch64, which builds with another, compiles instead.
            # --no-default-features is the build with no Go faking: it drops the fallback
            # interposition, which no other command here compiles.
            if [ "${{ matrix.arch }}" = x86_64 ]; then
              cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
              cargo clippy --locked -p agent --no-default-features --all-targets -- -D warnings
            else
              cargo check --locked -p agent --no-default-features --all-targets
            fi
            # The action runs this script under `set -e`, so a failing suite is caught with `||`,
            # and the exit at the end reports it once the Python tool and the summary have run.
            # Streamed, so a run that hangs still shows how far it got; pipefail carries cargo's
            # status past tee.
            set -o pipefail
            status=0
            cargo test --locked --workspace --all-features --no-fail-fast 2>&1 | tee test.log \
              || status=1
            (cd python && PYTHONPATH=. python3 -m unittest discover -s tests -t .) || status=1
            if [ $status -ne 0 ]; then
              echo "=== freebsd failed ==="
              grep -E '^test .+ \.\.\. FAILED$' test.log || true
            fi
            exit $status

      # A failing run copies nothing back, but the VM is still up until the job ends, so the log
      # is read out of it, where the workspace sits at the same path as on the host.
      - name: Name what failed
        if: failure()
        shell: bash
        timeout-minutes: 5
        run: |
          ssh freebsd cat "${{ github.workspace }}/test.log" >test.log || true
          .github/report-failure.sh "$PLATFORM" test.log

  # The cases that can disagree with themselves between one run and the next: the seqlock the
  # readers and a writer share, and the clock group racing against a write. Running them many times
  # on a real machine is what stands in for a model checker here.
  stress:
    name: linux stress
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLATFORM: linux stress
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install

      - name: Build the cases once
        run: cargo build --locked --workspace --all-targets --all-features

      # A single failing round is the whole point, so the loop stops at the first one and says
      # which round it was. Repeats are cheap next to the build that precedes them.
      - name: Repeat the racy cases
        shell: bash
        run: |
          set -u
          for round in $(seq 1 40); do
            if ! cargo test --locked -p common --test seqlock >"$RUNNER_TEMP/round.log" 2>&1; then
              echo "round $round of the seqlock cases failed" >&2
              cat "$RUNNER_TEMP/round.log"
              cp "$RUNNER_TEMP/round.log" "$RUNNER_TEMP/test.log"
              exit 1
            fi
          done
          for round in $(seq 1 10); do
            if ! cargo test --locked -p agent --test clock_group >"$RUNNER_TEMP/round.log" 2>&1; then
              echo "round $round of the clock group failed" >&2
              cat "$RUNNER_TEMP/round.log"
              cp "$RUNNER_TEMP/round.log" "$RUNNER_TEMP/test.log"
              exit 1
            fi
          done

      - name: Name what failed
        if: failure()
        shell: bash
        run: .github/report-failure.sh "$PLATFORM" "$RUNNER_TEMP/test.log"

  # One check to point branch protection at, passing only when every job above has.
  gate:
    name: gate
    needs: [linux, cross, macos, freebsd, stress]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job
        run: |
          failed=
          for job in \
            'linux=${{ needs.linux.result }}' \
            'cross=${{ needs.cross.result }}' \
            'macos=${{ needs.macos.result }}' \
            'freebsd=${{ needs.freebsd.result }}' \
            'stress=${{ needs.stress.result }}'; do
            [ "${job#*=}" = success ] || failed="${failed:+$failed, }${job%%=*} is ${job#*=}"
          done
          if [ -n "$failed" ]; then
            echo "${failed}, so this commit does not pass." >&2
            exit 1
          fi
