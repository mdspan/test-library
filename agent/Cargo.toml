[package]
name = "agent"
version.workspace = true
edition.workspace = true
description = "The preloaded library that shifts a process's view of the clock."
license.workspace = true
repository.workspace = true

[lib]
name = "timewarp"
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
cfg-if = { workspace = true }
common = { path = "../common", default-features = false }
controller = { path = "../controller", default-features = false }
ctor = { workspace = true }
libc = { workspace = true }

[features]
default = ["vdso"]

# The synthetic vDSO on Linux and the interposed Go clock fallback on FreeBSD. Off leaves symbol
# interposition, which reaches every program that calls libc.
vdso = ["common/vdso", "controller/vdso"]

[dev-dependencies]
common = { path = "../common" }
libc = { workspace = true }
tempfile = "3.24.0"

# The slot try-lock the Go shims claim in assembly is modelled in Rust and checked under loom,
# which drives the interleavings the atomic exchange hides. Pulled in only for a `--cfg loom` run.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"
