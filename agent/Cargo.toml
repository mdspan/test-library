[package]
name = "agent"
version.workspace = true
edition.workspace = true
description = "The preloaded library that shifts a process's view of the clock."
license.workspace = true
repository.workspace = true

[lib]
name = "timewarp"
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
cfg-if = { workspace = true }
common = { path = "../common", default-features = false }
controller = { path = "../controller", default-features = false }
ctor = { workspace = true }
libc = { workspace = true }

[features]
default = ["vdso"]

# The synthetic vDSO on Linux and the substituted timekeep page on FreeBSD, with the updater that
# keeps the page fresh. Off leaves symbol interposition, which reaches every program that calls
# libc.
vdso = ["common/vdso", "controller/vdso"]

[dev-dependencies]
common = { path = "../common" }
libc = { workspace = true }
tempfile = "3.24.0"
