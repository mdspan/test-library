[package]
name = "common"
version.workspace = true
edition.workspace = true
description = "Session state, configuration, and time arithmetic shared by the agent and its tools."
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# The FreeBSD half of way #2: the timekeep page and the updater that keeps it fresh. Off here and
# turned on by whichever crate above wants it, so a build made without it carries none of the code
# that runs a process beside a session.
vdso = []

[dependencies]
cfg-if = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
tempfile = "3.24.0"
