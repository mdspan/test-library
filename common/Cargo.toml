[package]
name = "common"
version.workspace = true
edition.workspace = true
description = "Session state, configuration, and time arithmetic shared by the agent and its tools."
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Gates nothing in this crate; the crates above pass their own `vdso` feature down to it.
vdso = []

[dependencies]
cfg-if = { workspace = true }
libc = { workspace = true }
toml = { version = "1.1.8", default-features = false, features = ["parse", "std"] }

[dev-dependencies]
tempfile = "3.24.0"

# The registry a forked child closes its parent's write locks from is modelled under loom, which
# drives the interleavings of an acquire against a fork. Pulled in only for a `--cfg loom` run.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"
