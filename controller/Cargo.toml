[package]
name = "controller"
version.workspace = true
edition.workspace = true
description = "Changing a live session: operations staged on a transaction and published at once."
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["vdso"]

# Passes the flag down to `common`.
vdso = ["common/vdso"]

[dependencies]
common = { path = "../common", default-features = false }
libc = { workspace = true }

[dev-dependencies]
common = { path = "../common" }
libc = { workspace = true }
tempfile = "3.24.0"
